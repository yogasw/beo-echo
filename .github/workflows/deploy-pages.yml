name: Deploy docs to GitHub Pages

# Builds the frontend in STATIC mode (no backend) and publishes it to GitHub Pages.
# Backend-only features (login, cloud, create project, MCP token generation) are
# hidden by the VITE_STATIC_MODE build flag.

on:
  # Called by docker-publish.yml after a release finishes, so Pages redeploys on
  # every release. Also runnable manually from the Actions tab.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Project page (username.github.io/<repo>/) → keep the repo-name base.
          # Custom domain or user/org page (served at root) → set BASE_PATH to '' (empty).
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      # GitHub Pages must not run Jekyll, or the _app/ directory is dropped.
      - name: Disable Jekyll
        run: touch build/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
